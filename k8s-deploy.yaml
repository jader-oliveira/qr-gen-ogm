apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-generator-ogm
  namespace: breutech
  labels:
    app: qr-generator-ogm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qr-generator-ogm
  template:
    metadata:
      labels:
        app: qr-generator-ogm
    spec:
      containers:
        - name: qr-generator-ogm
          image: jaderoliver/qr-gen-ogm:0.0.7
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
              scheme: HTTP
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
              scheme: HTTP
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 650m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 745Mi

---

apiVersion: v1
kind: Service
metadata:
  name: svc-qr-generator
  namespace: breutech
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8501
  selector:
    app: qr-generator-ogm

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qr-generator-ogm
  namespace: breutech
spec:
  parentRefs:
  - name: breutech
    namespace: ingress
    sectionName: https
  hostnames:
  - qrcodegen.breutech-solutions.be
  rules:
  - backendRefs:
    - name: svc-qr-generator
      port: 80